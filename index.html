  var ready = null;

  function doMove() {

    if (!loaded) { listEl.appendChild(el("p", { className: "note", textContent: "Hämtar listorna…" })); return; }
    if (!list) {
      listEl.appendChild(el("p", { className: "note", textContent: canEdit ? "Det finns inga listor ännu. Tryck på Redigera för att skapa den första." : "Det finns inga listor ännu." }));
      return;
    }
    if (editing) {
      listEl.appendChild(el("div", { className: "edit-list" }, [
        el("label", { htmlFor: "listTitle", textContent: "Listans namn" }),
        field(list, "title", "listTitle", "Listans namn", renderPicker),
        el("label", { htmlFor: "listBlurb", textContent: "Kort beskrivning" }),
        field(list, "blurb", "listBlurb", "Kort beskrivning")
      ]));
      list.sections.forEach(function (s, i) { listEl.appendChild(editSection(list, s, i)); });
      listEl.appendChild(el("button", { className: "add", id: "addSection", type: "button", textContent: "+ Lägg till avsnitt", on: { click: function () {
        var s = { id: newId(), title: "", items: [] };
        list.sections.push(s); render();
        $("t-" + s.id).focus();
      } } }));
      listEl.querySelectorAll("textarea").forEach(fit);
    } else {
      if (list.blurb) listEl.appendChild(el("p", { className: "blurb", textContent: list.blurb }));
      var views = list.sections.map(viewSection).filter(Boolean);
      views.forEach(function (v) { listEl.appendChild(v); });
      if (!views.length) {
        listEl.appendChild(el("p", { className: "note", textContent: onlyLeft && all.length ? "Allt är avbockat." : "Listan är tom." }));
      }
    }
    if (focusId && $(focusId) && focusId !== "picker") $(focusId).focus({ preventScroll: true });
  }

  // Tomma rader rensas först när redigeringen avslutas, så att de går att fylla i under tiden.
  function prune(list) {
    list.sections.forEach(function (s) { s.items = s.items.filter(function (i) { return i.text.trim(); }); });
    list.sections = list.sections.filter(function (s) { return s.title.trim() || s.items.length; });
    if (!list.title || !list.title.trim()) list.title = "Namnlös lista";
  }
  function createList(from, name) {
    var max = ordered().reduce(function (m, l) { return Math.max(m, l.order || 0); }, 0);
    var id = "l" + newId();
    lists[id] = {
      id: id, order: max + 1,
      title: name || (from ? from.title + " (kopia)" : "Ny lista"),
      blurb: name ? "" : (from ? from.blurb || "" : ""),
      sections: from ? clone(from.sections) : []
    };
    currentId = id;
    dirtyLists[id] = true;
    queueSave(0);
  }

  $("picker").addEventListener("change", function (e) { currentId = e.target.value; onlyLeft = false; render(); window.scrollTo(0, 0); });
  $("editBtn").addEventListener("click", function () {
    if (!loaded) return;
    selected = {}; closePanel();
    if (!current()) { createList(null); editing = true; render(); return; }
    editing = !editing;
    if (!editing) { prune(current()); saveList(); }
    render();
    window.scrollTo(0, 0);
  });
  $("newJob").addEventListener("click", function () {
    var tpl = lists.rep;
    if (!tpl) return;
    var name = (window.prompt("Namn på jobbet (till exempel Kyiv november)") || "").trim();
    if (!name) return;
    createList(tpl, name);
    onlyLeft = false;
    render();
    window.scrollTo(0, 0);
  });
  $("copyBtn").addEventListener("click", function () {
    prune(current()); saveList();
    createList(current());
    render();
    window.scrollTo(0, 0);
    $("listTitle").focus();
  });
  $("deleteBtn").addEventListener("click", function () {
    var id = currentId, before = clone(lists[id]);
    delete lists[id];
    dirtyLists[id] = true;
    currentId = ordered()[0].id;
    editing = false;
    offerUndo("Listan är borttagen.", function () { lists[id] = before; currentId = id; dirtyLists[id] = true; render(); queueSave(0); });
    render(); queueSave(0);
  });
  $("resetBtn").addEventListener("click", function () {
    var id = currentId, before = clone(ticks[id] || {});
    offerUndo("Alla punkter är urbockade.", function () { ticks[id] = before; render(); saveTicks(); });
    ticks[id] = {};
    onlyLeft = false;
    render(); saveTicks();
  });
  $("undo").addEventListener("click", function () {
    if (undoFn) { undoFn(); undoFn = null; syncBaseline(); while (undoStack.length && sameAsNow(undoStack[undoStack.length - 1])) undoStack.pop(); render(); }
    $("toast").hidden = true;
  });
  $("moveBtn").addEventListener("click", openPanel);
  $("moveCancel").addEventListener("click", closePanel);
  $("moveGo").addEventListener("click", doMove);
  $("moveList").addEventListener("change", fillSections);
  $("clearSel").addEventListener("click", function () { selected = {}; closePanel(); render(); });
  $("undoBtn").addEventListener("click", function () {
    var e = null;
    while (undoStack.length) {
      var c = undoStack.pop();
      if (!sameAsNow(c)) { e = c; break; }
    }
    if (!e) { render(); return; }
    lists[e.id] = e.data; currentId = e.id;
    baseline[e.id] = JSON.stringify(e.data); lastTouch[e.id] = 0;
    dirtyLists[e.id] = true;
    (e.also || []).forEach(function (x) { lists[x.id] = x.data; baseline[x.id] = JSON.stringify(x.data); lastTouch[x.id] = 0; dirtyLists[x.id] = true; });
    selected = {};
    queueSave(0);
    $("toast").hidden = true; undoFn = null;
    render();
  });
  window.addEventListener("pagehide", function () { clearTimeout(saveTimer); flush(); });
  window.addEventListener("hashchange", function () {
    var id = location.hash.slice(1);
    if (lists[id] && !editing) { currentId = id; onlyLeft = false; render(); window.scrollTo(0, 0); }
  });

  function message(text) { listEl.textContent = ""; listEl.appendChild(el("p", { className: "note", textContent: text })); }
  function busy() { return writing || ticksDirty || Object.keys(dirtyLists).length > 0; }

  function start(database, user) {
    db = database;
    var timer = setTimeout(function () {
      if (!loaded) message("Listorna går inte att nå just nu. Kontrollera nätet.");
      else setStatus("Du ser en sparad kopia som kan vara inaktuell.");
    }, 10000);

    db.collection("lists").onSnapshot(function (snap) {
      if (!snap.metadata.fromCache) { clearTimeout(timer); if (!failed) setStatus(""); }
      if (snap.empty && snap.metadata.fromCache) return;
      if (busy()) return;
      if (editing && loaded) return;
      var next = {};
      snap.docs.forEach(function (d) {
        var body = clone(d.data());
        body.id = d.id;
        if (!body.sections) body.sections = [];
        next[d.id] = body;
      });
      if (loaded && JSON.stringify(next) === JSON.stringify(lists)) return;
      lists = next;
      syncBaseline();
      var wanted = location.hash.slice(1); if (!wanted) { try { wanted = localStorage.getItem("checklista:senast") || ""; } catch (e) {} }
      if (!loaded && lists[wanted]) currentId = wanted;
      if (!lists[currentId]) currentId = ordered().length ? ordered()[0].id : null;
      loaded = true;
      render();
    }, function () {
      clearTimeout(timer);
      if (!loaded) message("Listorna kunde inte öppnas. Ladda om sidan.");
      else setStatus("Kontakten med listorna bröts. Ladda om sidan innan du ändrar något mer.");
    });

    if (!user) return;
    user.canEdit().then(function (yes) { canEdit = yes; render(); });
    user.id().then(function (uid) {
      if (!uid) return;
      ticksRef = db.doc("data/users/" + uid + "/ticks");
      ticksRef.onSnapshot(function (snap) {
        if (ticksDirty || writing || !snap.exists) return;
        var body = clone(snap.data());
        if (JSON.stringify(body) === JSON.stringify(ticks)) return;
        ticks = body;
        writeLocal("ticks", ticks);
        render();
      }, function () { ticksLocalOnly = true; });
    });
  }

  if (!window.claude || !claude.use) { message("Listorna går bara att öppna på sin länk i Claude."); return; }
  Promise.all([claude.use("db"), claude.use("user")]).then(function (r) {
    if (!r[0]) { message("Listorna kunde inte öppnas. Logga in på claude.ai och ladda om sidan."); return; }
    start(r[0], r[1]);
  });
})();
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});</script>
